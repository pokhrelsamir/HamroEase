{% extends "base.html" %}

{% block title %}
    Delete Hotel | HamroEase
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-body text-center p-5">

                        <div class="mb-4">
                            <i class="fa-solid fa-triangle-exclamation text-danger fs-1"></i>
                        </div>

                        <h3 class="mb-3">
                            Delete Hotel?
                        </h3>

                        <p class="text-muted">

                            Are you sure you want to delete

                            <strong>
                                {{ hotel.name }}
                            </strong>

                           ?

                            <br>

                            This action cannot be undone.

                        </p>

                        <form method="POST">

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-danger me-2">

                                <i class="fa-solid fa-trash me-1"></i>
                                Delete

                            </button>

                            <a
                                href="{% url 'hotel_list' %}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
