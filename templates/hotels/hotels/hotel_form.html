{% extends "base.html" %}

{% block title %}
    {% if form.instance.pk %}
        Update Hotel
    {% else %}
        Create Hotel
    {% endif %}
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">

                        <h3 class="mb-0">

                            {% if form.instance.pk %}
                                Update Hotel
                            {% else %}
                                Add New Hotel
                            {% endif %}

                        </h3>

                    </div>

                    <div class="card-body">

                        <form method="POST"
                              enctype="multipart/form-data">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    {% if form.instance.pk %}
                                        Update Hotel
                                    {% else %}
                                        Save Hotel
                                    {% endif %}

                                </button>

                                <a href="{% url 'hotel_list' %}"
                                   class="btn btn-secondary">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
