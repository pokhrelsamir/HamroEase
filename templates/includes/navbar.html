{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold fs-3 text-primary"
           href="{% url 'home' %}">
            HamroEase
        </a>

        <!-- Mobile Toggle -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navigation -->

        <div class="collapse navbar-collapse"
             id="navbarMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'hotel-list' %}">
                        Hotels
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="#">
                        Rooms
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="#">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="#">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Right Side -->

            <ul class="navbar-nav">

                {% if user.is_authenticated %}

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           data-bs-toggle="dropdown">

                            <i class="fa-solid fa-user"></i>
                            {{ user.full_name }}

                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <a class="dropdown-item"
                                   href="#">
                                    Dashboard
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   href="#">
                                    My Profile
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>

                                <form method="post"
                                      action="{% url 'logout' %}">

                                    {% csrf_token %}

                                    <button
                                        class="dropdown-item">

                                        Logout

                                    </button>

                                </form>

                            </li>

                        </ul>

                    </li>

                {% else %}

                    <li class="nav-item">

                        <a class="btn btn-outline-primary me-2"
                           href="{% url 'login' %}">
                            Login
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="btn btn-primary"
                           href="{% url 'register' %}">
                            Register
                        </a>

                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
